<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Curriculum</title>
    <style>
        body {
          font-family: Arial, sans-serif;
          color: #222;
          line-height: 1.5;
          max-width: 800px;
          margin: 40px auto;
          padding: 0 30px;
        }

        h1 {
          text-align: center;
          margin-bottom: 5px;
          font-size: 28px;
          letter-spacing: 1px;
        }

        .contact {
          text-align: left;
          font-size: 16px;
          margin-bottom: 30px;
        }
        .contact p {
          margin: 2px 0;
        }

        h2 {
          font-size: 18px;
          border-bottom: 1px solid #333;
          padding-bottom: 4px;
          margin-top: 28px;
          text-transform: uppercase;
        }

        ul {
          padding-left: 20px;
        }

        li {
          margin-bottom: 8px;
        }

        .job,
        .course,
        .education {
          margin-bottom: 16px;
        }

        .title {
          font-weight: bold;
        }

        .period {
          font-style: italic;
        }
    </style>
</head>
<body>
<h1 class="name" th:text="${curriculumData.personalInfo.name}"></h1>

<div class="contact">
    <p>
        <span class="city" th:text="${curriculumData.personalInfo.city}"></span><span th:if="${curriculumData.personalInfo.city != null and curriculumData.personalInfo.state != null}">/</span><span class="state" th:text="${curriculumData.personalInfo.state}"></span>
    </p>
    <p>
        <span class="marital-status" th:text="${curriculumData.personalInfo.maritalStatus}"></span><span>, </span><span class="age" th:text="${curriculumData.personalInfo.age + ' anos'}"></span>
    </p>
    <p class="phone-number" th:text="${'Telefone: ' + curriculumData.personalInfo.phoneNumber}"></p>
</div>

<th:block th:if="${curriculumData.professionalGoal != null and !curriculumData.professionalGoal.isBlank()}">
<h2 class="professional-goal">Objetivo Profissional</h2>
<p th:text="${curriculumData.professionalGoal}"></p>
</th:block>

<h2 class="professional-summary">Resumo Profissional</h2>
<p th:text="${curriculumData.professionalSummary}"></p>

<th:block th:if="${!curriculumData.education.isEmpty()}">
<h2 class="educational-background">Forma&ccedil;&atilde;o</h2>
<div class="education" th:each="education : ${curriculumData.education}">
    <p class="title" th:text="${education.title}"></p>
    <p th:text="${education.institution}"></p>
    <p th:text="${education.description}"></p>
    <p class="period" th:text="${education.period}"></p>
</div>
</th:block>

<h2 class="work-experience">Experi&ecirc;ncias Profissionais</h2>

<div class="job" th:each="job : ${curriculumData.workExperience}">
    <p class="title" th:text="${job.company}"></p>
    <p class="position" th:text="${job.position}"></p>
    <p class="period" th:text="${job.period}"></p>
    <p class="description" th:text="${job.description}"></p>
</div>

<th:block th:if="${!curriculumData.complementaryCourses.isEmpty()}">
<h2 class="complementary">Qualifica&ccedil;&otilde;es e Cursos Complementares</h2>

<div class="course" th:each="course : ${curriculumData.complementaryCourses}">
    <p class="title" th:text="${course.title}"></p>
    <p th:text="${course.institution}"></p>
    <p class="period" th:text="${course.period}"></p>
    <p th:text="${course.workload}"></p>
    <p class="description" th:text="${course.description}"></p>
</div>
</th:block>

<h2 class="qualities">Principais Qualidades / Caracter&iacute;sticas</h2>
<ul>
    <li th:each="quality : ${curriculumData.qualities}" th:text="${quality}"></li>
</ul>
</body>
</html>
